spring.application.name=jarvis

# Gemini (shared with the airline side). Set GEMINI_API_KEY in the environment; never commit a key.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash

# Road routing for suggested road trips (public OSRM demo server by default)
osrm.url=https://router.project-osrm.org
