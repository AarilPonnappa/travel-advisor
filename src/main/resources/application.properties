spring.application.name=jarvis
server.port=${PORT:8080}

# a .env file in the folder you start the app from is read automatically (KEY=value lines, no quotes, no "export")
spring.config.import=optional:file:.env[.properties]

# database comes from env vars (or .env) so nothing secret lives in the repo
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.thymeleaf.cache=false

# api keys - anything left blank falls back to built-in estimates
jarvis.currency=${APP_CURRENCY:USD}

# openrouteservice: driving routes, travel-time matrix, city lookup (free key, no card)
jarvis.ors.key=${OPENROUTESERVICE_API_KEY:}

# geoapify: activity places + restaurants by cuisine (free key, no card)
jarvis.geoapify.key=${GEOAPIFY_API_KEY:}

# transitous needs no key, only a user agent with a way to contact you
jarvis.transitous.user-agent=${TRANSITOUS_USER_AGENT:jarvis-travel-advisor/1.0 (contact: set TRANSITOUS_USER_AGENT)}

# google flights + google hotels. serpapi first, searchapi.io when serpapi fails (flights then try duffel)
jarvis.serpapi.key=${SERPAPI_API_KEY:}
jarvis.searchapi.key=${SEARCHAPI_API_KEY:}
# duffel is the last flight fallback. a duffel_test_ token works but only returns sample fares
jarvis.duffel.token=${DUFFEL_ACCESS_TOKEN:}

jarvis.reddit.client-id=${REDDIT_CLIENT_ID:}
jarvis.reddit.client-secret=${REDDIT_CLIENT_SECRET:}
jarvis.reddit.user-agent=${REDDIT_USER_AGENT:jarvis-travel-advisor/1.0}

# two separate gemini keys: one builds the planner, the other powers the chatbot
jarvis.gemini.planner-key=${GEMINI_PLANNER_API_KEY:}
jarvis.gemini.planner-model=${GEMINI_PLANNER_MODEL:gemini-3.8-flash}
jarvis.gemini.chat-key=${GEMINI_CHAT_API_KEY:}
jarvis.gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-3.8-flash}

# base urls are overridable mostly so tests can point at a fake server
jarvis.url.ors=https://api.heigit.org/openrouteservice
jarvis.url.ors-geocode=https://api.heigit.org/pelias/v1
jarvis.url.geoapify=https://api.geoapify.com
jarvis.url.transitous=https://api.transitous.org
jarvis.url.serpapi=https://serpapi.com/search.json
jarvis.url.searchapi=https://www.searchapi.io/api/v1/search
jarvis.url.duffel=https://api.duffel.com
jarvis.url.open-meteo-geocode=https://geocoding-api.open-meteo.com/v1/search
jarvis.url.open-meteo-forecast=https://api.open-meteo.com/v1/forecast
jarvis.url.open-meteo-archive=https://archive-api.open-meteo.com/v1/archive
jarvis.url.wikivoyage=https://en.wikivoyage.org/w/api.php
jarvis.url.reddit-oauth=https://oauth.reddit.com
jarvis.url.reddit-auth=https://www.reddit.com/api/v1/access_token
jarvis.url.reddit-public=https://www.reddit.com
jarvis.url.gemini=https://generativelanguage.googleapis.com/v1beta

# keep slow third-party calls from hanging a page forever
jarvis.http.connect-timeout-ms=5000
jarvis.http.read-timeout-ms=45000
