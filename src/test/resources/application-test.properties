# full-application tests run against an in-memory database instead of Postgres
spring.datasource.url=jdbc:h2:mem:jarvis;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# never call real third-party apis from tests, whatever is in the environment or .env
jarvis.ors.key=
jarvis.geoapify.key=
jarvis.serpapi.key=
jarvis.searchapi.key=
jarvis.duffel.token=
jarvis.reddit.client-id=
jarvis.reddit.client-secret=
jarvis.gemini.planner-key=
jarvis.gemini.chat-key=
